project:
  type: website
  output-dir: dist
  render:
    - index.qmd
    - DataPrep_EDA.qmd
    - replacement-ledger.qmd
    - Clustering.qmd
    - PCA.qmd
    - NaiveBayes.qmd
    - DecTrees.qmd
    - Regression.qmd
    - AdaBoost.qmd
    - GradientBoosting.qmd
    - XGBoost.qmd
    - Conclusions.qmd
  resources:
    - assets/**
    - downloads/current/**
    - .nojekyll
website:
  title: "Crowd Forecasting"
  favicon: assets/brand-mark.svg
  description: "Information discovery, market calibration, and trader specialization in prediction markets."
  site-url: "https://sgoodell14.github.io/polymarket-market-efficiency/"
  search: false
  page-navigation: true
  bread-crumbs: false
  navbar:
    background: "#faf9f6"
    foreground: "#202c29"
    logo: assets/brand-mark.svg
    logo-alt: "Project mark"
    title: "Crowd Forecasting — Accuracy and Information on Polymarket <span class='navbar-author'>| Sam Goodell</span>"
    right:
      - text: "Introduction"
        href: index.qmd
      - text: "Explore the data"
        href: DataPrep_EDA.qmd
  sidebar:
    style: docked
    background: "#faf9f6"
    contents:
      - section: "The study"
        contents:
          - text: "Introduction"
            href: index.qmd
          - text: "DataPrep_EDA"
            href: DataPrep_EDA.qmd
          - text: "Clustering"
            href: Clustering.qmd
          - text: "PCA"
            href: PCA.qmd
      - section: "Later modules"
        contents:
          - text: "NaiveBayes"
            href: NaiveBayes.qmd
          - text: "DecTrees"
            href: DecTrees.qmd
          - text: "Regression"
            href: Regression.qmd
          - text: "AdaBoost"
            href: AdaBoost.qmd
          - text: "Gradient Boosting"
            href: GradientBoosting.qmd
          - text: "XGBoost"
            href: XGBoost.qmd
          - text: "Conclusions"
            href: Conclusions.qmd
  page-footer:
    left: "Crowd Forecasting"
    right: "Accuracy and Information on Polymarket"
format:
  html:
    filters:
      - filters/table-layout.lua
      - filters/figure-layout.lua
    include-after-body:
      text: |
        <link rel="stylesheet" href="assets/vendor/glightbox.min.css">
        <script src="assets/vendor/glightbox.min.js" defer></script>
        <script src="assets/reference-navigation.js?v=20261010-lightbox" defer></script>
    theme: [cosmo, theme.scss]
    grid:
      sidebar-width: 235px
      body-width: 850px
      margin-width: 210px
      gutter-width: 2.3rem
    toc: true
    toc-title: "On this page"
    title-block-banner: false
    code-copy: true
    smooth-scroll: false
    link-external-newwindow: true
    anchor-sections: true
    fig-format: png
    fig-dpi: 160
    lang: en
